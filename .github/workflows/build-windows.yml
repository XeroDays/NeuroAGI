name: Build Windows

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check package version against latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not $pkg) { throw "package.json version is missing." }
          $latest = ""
          $fetched = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>$null
          if ($LASTEXITCODE -eq 0 -and $fetched) {
            $latest = [string]$fetched
          }
          $normLatest = [string]$latest
          if ($normLatest.StartsWith("v") -or $normLatest.StartsWith("V")) {
            $normLatest = $normLatest.Substring(1)
          }
          Write-Host "package.json=$pkg latest_release=$latest"
          if ($pkg -eq $normLatest) {
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Versions match; skipping build."
          } else {
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "tag=v$pkg" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Versions differ; will publish v$pkg."
          }

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm ci

      - name: Build Windows installer
        if: steps.check.outputs.skip != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win

      - name: List build output
        if: steps.check.outputs.skip != 'true'
        run: dir dist

      - name: Create GitHub Release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check.outputs.tag }}
          name: NeuroAGI ${{ steps.check.outputs.tag }}
          generate_release_notes: true
          files: dist/*.exe
