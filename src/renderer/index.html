<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>NeuroAGI</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/themes.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/usage-bubbles.css">
  <link rel="stylesheet" href="styles/logs-panel.css">
  <link rel="stylesheet" href="styles/app.css">
</head>
<body class="app-shell">
  <div class="home-top-actions">
    <button type="button" id="btn-settings" class="glass-icon-btn" aria-label="Settings">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
    </button>
    <button type="button" id="btn-models" class="glass-models-btn" aria-label="Models">Models</button>
    <button type="button" id="btn-new-release" class="btn-new-release" hidden aria-label="New Release Available" title="New Release Available">
      New Release Available
    </button>
  </div>

  <!-- Settings popup -->
  <div id="settings-overlay" class="glass-overlay settings-overlay" hidden aria-modal="true" role="dialog" aria-labelledby="settings-modal-title">
    <div class="settings-modal">
      <div class="settings-modal-header">
        <h2 class="settings-modal-title" id="settings-modal-title">Settings</h2>
        <p class="settings-modal-subtitle">API keys for OpenRouter and Tavily.</p>
      </div>
      <div class="settings-modal-body">
        <nav class="settings-nav" role="tablist" aria-label="Settings sections">
          <button type="button" class="settings-tab is-active" data-tab="credentials" role="tab" aria-selected="true" aria-controls="settings-pane-credentials" id="settings-tab-credentials">Credentials</button>
        </nav>
        <div class="settings-panes">
          <div id="settings-pane-credentials" class="settings-pane" role="tabpanel" aria-labelledby="settings-tab-credentials">
            <div class="settings-field">
              <label class="settings-field-label" for="input-openrouter-key">OpenRouter API key</label>
              <input type="password" id="input-openrouter-key" class="settings-field-input" autocomplete="off" spellcheck="false">
              <span class="settings-field-hint">Get a key at <a href="https://openrouter.ai/keys" class="settings-ext-link" data-external-url="https://openrouter.ai/keys">https://openrouter.ai/keys</a></span>
              <div class="settings-field-test">
                <button type="button" id="btn-test-openrouter" class="settings-btn-test">Test key</button>
                <span id="status-openrouter-key" class="settings-test-status" aria-live="polite"></span>
              </div>
            </div>
            <div class="settings-field">
              <label class="settings-field-label" for="input-tavily-key">Tavily API key</label>
              <input type="password" id="input-tavily-key" class="settings-field-input" autocomplete="off" spellcheck="false">
              <span class="settings-field-hint">Get a key at <a href="https://app.tavily.com/home" class="settings-ext-link" data-external-url="https://app.tavily.com/home">https://app.tavily.com/home</a></span>
              <div class="settings-field-test">
                <button type="button" id="btn-test-tavily" class="settings-btn-test">Test key</button>
                <span id="status-tavily-key" class="settings-test-status" aria-live="polite"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="settings-modal-footer">
        <button type="button" id="btn-settings-devtools" class="settings-btn-devtools">Open DevTools</button>
        <button type="button" id="btn-settings-close" class="models-btn-close">Close</button>
        <button type="button" id="btn-settings-save" class="models-btn-update">Save</button>
      </div>
    </div>
  </div>

  <!-- Models popup -->
  <div id="models-overlay" class="glass-overlay models-overlay" hidden aria-modal="true" role="dialog" aria-labelledby="models-modal-title">
    <div class="models-modal">
      <div class="models-modal-header">
        <h2 class="models-modal-title" id="models-modal-title">Models</h2>
        <p class="models-modal-subtitle">Toggle which models run in Advance.</p>
      </div>
      <div class="models-tabs-bar" role="tablist">
        <button type="button" class="models-tab is-active" data-tab="free" role="tab" aria-selected="true" aria-controls="models-list-free">Free</button>
        <button type="button" class="models-tab" data-tab="paid" role="tab" aria-selected="false" aria-controls="models-list-paid">Paid</button>
      </div>
      <div class="models-modal-body" id="models-list-free" role="list"></div>
      <div class="models-modal-body" id="models-list-paid" role="list" hidden></div>
      <div class="models-modal-footer">
        <div class="models-footer-add">
          <button type="button" id="btn-models-add" class="models-btn-close">Add</button>
          <input type="text" id="input-models-add" class="models-add-input" hidden placeholder="provider/model-id" autocomplete="off" spellcheck="false" aria-label="OpenRouter model id">
        </div>
        <button type="button" id="btn-models-test" class="models-btn-close models-btn-test">Test latency</button>
        <button type="button" id="btn-models-close" class="models-btn-close">Close</button>
        <button type="button" id="btn-models-update" class="models-btn-update">Update</button>
      </div>
    </div>
  </div>

  <!-- Enable a model error -->
  <div id="error-overlay" class="glass-overlay error-overlay" hidden aria-modal="true" role="dialog" aria-labelledby="error-modal-title">
    <div class="error-modal">
      <div class="error-modal-header">
        <h2 class="error-modal-title" id="error-modal-title">Enable a model</h2>
        <p class="error-modal-message">Turn on at least one model in the Models popup.</p>
      </div>
      <div class="error-modal-footer">
        <button type="button" id="btn-error-ok" class="models-btn-close">OK</button>
        <button type="button" id="btn-error-open-models" class="models-btn-update">Open Models</button>
      </div>
    </div>
  </div>

  <!-- Softasium in-app installer (Home) -->
  <div id="release-overlay" class="glass-overlay release-overlay" hidden aria-modal="true" role="dialog" aria-labelledby="release-title">
    <div class="release-modal">
      <div class="release-modal-header">
        <h2 class="release-modal-title" id="release-title">New Release</h2>
        <button type="button" id="btn-release-close" class="release-close-btn" aria-label="Close release dialog">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="release-modal-body">
        <div id="release-notes" class="release-notes" aria-label="Release notes"></div>
        <p id="release-status" class="release-status" hidden></p>
      </div>
      <div class="release-modal-footer">
        <div id="release-download-progress" class="release-download-progress" hidden>
          <div class="release-progress-track" aria-hidden="true">
            <div id="release-progress-bar" class="release-progress-bar"></div>
          </div>
          <span id="release-download-percent" class="release-download-percent">0%</span>
        </div>
        <button type="button" id="btn-release-download" class="models-btn-update">Download Now</button>
      </div>
    </div>
  </div>
  <main class="app-main">
    <div class="home-stack">
      <img id="app-logo" class="app-logo" src="assets/icons/NeuroHome.png" alt="Neuro AGI">
      <div class="home-input-wrap">
        <input type="text" id="health-input" class="glass-input" placeholder="Describe how you're feeling…" aria-label="Health issue" autofocus>
        <button type="button" id="btn-start-diagnostics" class="glass-button" aria-label="Diagnose me">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
      <div class="home-selects-row">
        <div class="home-reasoning-wrap">
          <label for="select-reasoning" class="home-select-label">Reasoning level</label>
          <select id="select-reasoning" class="glass-select" aria-label="Reasoning level">
            <option value="none">None</option>
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
            <option value="very_high">Very High</option>
          </select>
        </div>
        <div class="home-demographics-wrap">
          <input type="text" id="input-name" class="home-name-input" placeholder="Name" aria-label="Name" autocomplete="off" spellcheck="false">
          <select id="select-gender" class="glass-select" aria-label="Gender">
            <option value="male" selected>Male</option>
            <option value="female">Female</option>
          </select>
          <select id="select-age" class="glass-select" aria-label="Age"></select>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="scripts/usage-bubbles.js"></script>
  <script type="module" src="scripts/logs-panel.js"></script>
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
