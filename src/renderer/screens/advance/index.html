<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>NeuroAGI</title>
  <link rel="stylesheet" href="../../styles/tokens.css">
  <link rel="stylesheet" href="../../styles/themes.css">
  <link rel="stylesheet" href="../../styles/motion.css">
  <link rel="stylesheet" href="../../styles/ui.css">
  <link rel="stylesheet" href="../../styles/shell.css">
  <link rel="stylesheet" href="../../styles/usage-bubbles.css">
  <link rel="stylesheet" href="../../styles/logs-panel.css">
  <link rel="stylesheet" href="../../styles/advance.css">
</head>
<body class="adv-shell">
  <header class="adv-header">
    <button type="button" id="adv-back" class="adv-back">Back</button>
    <div class="adv-header-titles">
      <h1 id="app-title" class="adv-brand"></h1>
      <span id="screen-title" class="adv-screen"></span>
      <span id="adv-patient" class="adv-patient"></span>
    </div>
    <span id="adv-round" class="adv-round" hidden></span>
    <button type="button" id="adv-compare" class="adv-compare-btn">Compare</button>
  </header>
  <main class="adv-main">
    <div id="adv-chips" class="adv-chips" role="tablist" aria-label="Models"></div>
    <div id="adv-threads" class="adv-threads"></div>
  </main>
  <footer class="adv-composer">
    <div class="adv-composer-wrap">
      <textarea id="adv-input" class="adv-input" rows="1"
        placeholder="Type a message…" aria-label="Message" autocomplete="off"></textarea>
      <button type="button" id="adv-stop-all" class="adv-stop-all" hidden>Stop all</button>
      <button type="button" id="adv-send" class="adv-send" aria-label="Send">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </footer>
  <script type="module" src="../../scripts/ui/shortcuts.js"></script>
  <script type="module" src="../../scripts/usage-bubbles.js"></script>
  <script type="module" src="../../scripts/logs-panel.js"></script>
  <script type="module" src="../../scripts/advance.js"></script>
</body>
</html>
